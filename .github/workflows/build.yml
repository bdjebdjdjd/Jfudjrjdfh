name: Build Android APK
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Extract ZIP & Auto Build APK
        run: |
          # 1. Unzip project if zip exists
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip
          fi

          # 2. Check if Native Gradle project exists
          NATIVE_DIR=$(dirname $(find . -maxdepth 3 -name "settings.gradle*" -o -name "build.gradle*" | head -n 1) 2>/dev/null || true)

          if [ -n "$NATIVE_DIR" ] && [ -f "$NATIVE_DIR/settings.gradle" -o -f "$NATIVE_DIR/settings.gradle.kts" ]; then
            echo "Native Android project found in $NATIVE_DIR"
            cd "$NATIVE_DIR"
            if [ ! -f "gradlew" ]; then
              gradle wrapper
            fi
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon -Pkotlin.stdlib.default.dependency=false
          else
            echo "Web project found, building with Capacitor wrapper..."
            npm install --legacy-peer-deps || true
            npm run build || npx vite build || true
            
            WEB_DIR="dist"
            if [ ! -d "dist" ] && [ -d "build" ]; then
              WEB_DIR="build"
            elif [ ! -d "dist" ] && [ ! -d "build" ]; then
              mkdir -p dist
              echo "<html><body><h1>Virtual Camera App</h1></body></html>" > dist/index.html
            fi

            npm install @capacitor/core @capacitor/cli @capacitor/android
            npx cap init "VirtualCam" "com.virtual.camera" --web-dir "$WEB_DIR"
            npx cap add android
            npx cap sync android

            # Fix Kotlin duplicate class issues
            echo "" >> android/build.gradle
            echo "subprojects { configurations.all { resolutionStrategy.eachDependency { DependencyResolveDetails details -> if (details.requested.group == 'org.jetbrains.kotlin' && (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) { details.useTarget 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22' } } } }" >> android/build.gradle

            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon -x test
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/outputs/apk/debug/*.apk"
